<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LMS Deadline Reminder</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <!-- ─── Header ─── -->
    <header class="header">
      <div class="header-left">
        <div class="logo">📡</div>
        <div>
          <h1>Deadline Reminder</h1>
          <p class="subtitle" id="lastScan">No scan yet</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="scanBtn" class="btn-icon" title="Scan current page">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round"
               stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
        </button>
        <button id="settingsBtn" class="btn-icon" title="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round"
               stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0
                     0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65
                     0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0
                     0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9
                     19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0
                     1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0
                     0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0
                     1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6
                     9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1
                     0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0
                     9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2
                     2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65
                     0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0
                     1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65
                     1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0
                     1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- ─── Filter Tabs ─── -->
    <nav class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="urgent">🔴 Urgent</button>
      <button class="filter-btn" data-filter="week">This Week</button>
      <button class="filter-btn" data-filter="later">Later</button>
      <button class="filter-btn" data-filter="submitted">✓ Done</button>
    </nav>

    <!-- ─── Deadline List ─── -->
    <main class="deadline-list" id="deadlineList"></main>

    <!-- ─── Empty State ─── -->
    <div class="empty-state" id="emptyState" style="display:none">
      <div class="empty-icon">📭</div>
      <h3>No deadlines found</h3>
      <p>Navigate to your university portal (Canvas, Moodle, Blackboard…) and
         click the <strong>⟳ Scan</strong> button above, or just visit your
         assignments page — the extension auto-scans known LMS sites.</p>
    </div>

    <!-- ─── Footer ─── -->
    <footer class="footer">
      <button id="exportAllBtn" class="btn-secondary">📅 Export All (.ics)</button>
      <button id="clearBtn" class="btn-text">Clear All</button>
    </footer>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="calendar.js"></script>
  <script src="popup.js"></script>
</body>
</html>
